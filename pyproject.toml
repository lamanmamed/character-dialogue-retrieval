[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "character-dialogue-retrieval"
version = "0.1.0"
description = "Character identification from dialogue using TF-IDF and cosine similarity"
requires-python = ">=3.10"
dependencies = [
    "nltk>=3.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
